  <line x1="185" y1="215" x2="205" y2="215" stroke="#c42050" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M188 215 L195 235 L202 215" stroke="#c42050" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Crack on pillar -->
  <path d="M150 220 L146 232 L153 240 L148 252" stroke="#b87a20" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
