  <path d="M72 100 L86 114 L110 86" stroke="#1a8a5a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Right bubble (mirrored) -->
  <path d="M210 60 L258 60 C264 60 269 65 269 71 L269 145 C269 151 264 156 258 156 L230 156 L242 178 L212 156 L210 156" stroke="#c42050" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M210 60 L162 60 C156 60 151 65 151 71 L151 145 C151 151 156 156 162 156 L210 156" stroke="#c42050" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
