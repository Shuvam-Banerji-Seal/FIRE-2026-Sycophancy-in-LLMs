<svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left bubble -->
  <path d="M90 60 L42 60 C36 60 31 65 31 71 L31 145 C31 151 36 156 42 156 L70 156 L58 178 L88 156 L90 156" stroke="#0a7a9e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M90 60 L138 60 C144 60 149 65 149 71 L149 145 C149 151 144 156 138 156 L90 156" stroke="#0a7a9e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
