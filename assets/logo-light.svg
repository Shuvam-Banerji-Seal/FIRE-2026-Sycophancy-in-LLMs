  <path d="M192 100 L206 114 L230 86" stroke="#1a8a5a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Center broken scale -->
  <line x1="150" y1="190" x2="150" y2="260" stroke="#2c2416" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="130" y1="260" x2="170" y2="260" stroke="#2c2416" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Left arm -->
  <line x1="150" y1="200" x2="105" y2="215" stroke="#0a7a9e" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="95" y1="215" x2="115" y2="215" stroke="#0a7a9e" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M98 215 L105 235 L112 215" stroke="#0a7a9e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
