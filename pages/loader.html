<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sycophancy Loader</title>
  <link rel="stylesheet" href="../css/loader.css">
  <link rel="stylesheet" href="../css/logo.css">
</head>
<body>

  <div data-logo="loader"></div>

  <h2>Same LLM · Same Case · Opposite Answers</h2>

  <div class="chats">
    <div class="chat-box">
      <div class="chat-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5-1.3c1.5.8 3.2 1.3 5 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/>
        </svg>
        Chat A
        <span class="tag">SESS 01</span>
      </div>
      <div class="chat-body" id="body1"></div>
    </div>
    <div class="chat-box">
      <div class="chat-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5-1.3c1.5.8 3.2 1.3 5 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/>
        </svg>
        Chat B
        <span class="tag">SESS 02</span>
      </div>
      <div class="chat-body" id="body2"></div>
    </div>
  </div>

  <div class="bottom-text" id="bottomText">
    The model agreed with both — classic sycophancy.
  </div>

  <div class="pretext-stats" id="pretext-stats"></div>

  <script src="../js/logo.js"></script>
  <script type="module" src="../js/loader.js"></script>
</body>
</html>
